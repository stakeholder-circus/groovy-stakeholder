name: ci-native

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: wtfjoke/setup-groovy@99d04dab4f894e4ed521bef21904e79cba05cda4 # v3.0.2
        with:
          groovy-version: '4.0.26'
      - run: python3 scripts/validate_scaffold.py
